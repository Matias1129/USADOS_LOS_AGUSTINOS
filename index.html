<!DOCTYPE html>
<html>
<head>
    <title>Usados los Agustinos</title>

    <style>
        body {
           margin: 0;
           font-family: Arial;
           background: #1a1a1a;
           color: white;
        }  

        header {
            background: #000;
            color: #d4af37;
            text-align: center;
            padding: 30px;
        }

        .productos {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            border: 1px solid #d4af37;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>USADOS LOS AGUSTINOS</h1>
    <p>Neveras y lavadoras al mejor precio</p>
</header>

<section class="productos">

    <div class="card">
        <img src="nevera.jpg">
        <h3>Neveras</h3>
        <p>La mejor calidad</p>
    </div>

    <div class="card">
        <img src="lavadora.jpg">
        <h3>Lavadoras</h3>
        <p>Garantía de 3 meses</p>
    </div>

</section>

</body>
</html>
